# docker-compose.local811-proof.yml — LOCAL-811 OWN isolated pool/generation stack.
#
# Separate project (-p local811), OWN postgres volume, spare port (58433). Never
# touches the shared audioura-* containers, Michael's development-postgres-2-1, or
# any other LOCAL-* stack. The postgres is seeded at first init from the LOCAL-778
# schema (stop_pool + audio_tours + plans), in this stack's OWN volume.
#
# UP:   docker compose -p local811 -f docker-compose.local811-proof.yml up -d
# DOWN: docker compose -p local811 -f docker-compose.local811-proof.yml down -v
#
# The live tour is run as a ONE-SHOT generator container on this stack's network
# (see run_local811_container.py), with STORIED_MODE + the stop pool ENABLED so the
# seeded bad Belvedere rows take the reuse path and are auto-rejected by the
# LOCAL-811 museum checks, then researched fresh.
services:
  postgres:
    image: postgres:15-alpine
    container_name: local811-postgres
    environment:
      POSTGRES_DB: audiotours
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "58433:5432"
    volumes:
      - local811_pg:/var/lib/postgresql/data
      - ./local778-initdb:/docker-entrypoint-initdb.d:ro

volumes:
  local811_pg:
