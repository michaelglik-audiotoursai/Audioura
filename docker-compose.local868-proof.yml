# docker-compose.local868-proof.yml — LOCAL-868 OWN isolated stack for the app's
# "Paste a list of places" live run (D753: own stack, never the shared audioura-*
# containers, never :5000/:5002, never the live DB).
#
# Separate project (-p local868), OWN postgres volume. Host ports are the app's
# local-mode ports + 10000 (the app is built with --dart-define=DEBUG_PORT_OFFSET=10000):
#   generator 15000, orchestrator 15002, user-api 15003. Everything else stays on
# the compose network. Every service builds from THIS worktree.
#
# Spend is capped by the meter contract: PYTHONPATH=/opt/meter, TASK_BUDGET_ID=LOCAL-868,
# TASK_BUDGET_USD=0.40, meter rows land in ./_local868_meterlogs (never committed).
#
# UP:   docker compose -p local868 -f docker-compose.local868-proof.yml up -d --build
# DOWN: docker compose -p local868 -f docker-compose.local868-proof.yml down -v
services:
  postgres-2:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: audiotours
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "55968:5432"
    volumes:
      - local868_pg:/var/lib/postgresql/data
      - ./local821-initdb:/docker-entrypoint-initdb.d:ro

  polly-tts-1:
    build:
      context: .
      dockerfile: Dockerfile.polly-tts
    environment:
      - TTS_ENGINE=kokoro
      - KOKORO_URL=http://host.docker.internal:5181/render
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tour-generation-modernized-1:
    build:
      context: .
      dockerfile: Dockerfile.modernized
    environment:
      - JOB_STORE_MODE=layered
      - DB_HOST=postgres-2
      - DB_PORT=5432
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - POLLY_TTS_URL=http://polly-tts-1:5018
      - PYTHONUNBUFFERED=1
    volumes:
      - ./_local868_tours:/app/tours
    depends_on:
      - postgres-2
      - polly-tts-1

  coordinates-fromai:
    build:
      context: ./coordinates_fromAI
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  user-api-2:
    build:
      context: ./user-tracking
    ports:
      - "15003:5000"
    depends_on:
      - postgres-2
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres-2:5432/audiotours
      DB_HOST: postgres-2
      DB_NAME: audiotours
      DB_USER: admin
      DB_PASSWORD: password123
      DB_PORT: "5432"
      GATEWAY_API_KEY: ""
      ALLOW_UNAUTHENTICATED_ENTITLEMENTS: "true"

  tour-generator:
    build:
      context: .
      dockerfile: Dockerfile.generator
    ports:
      - "15000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERP_API_KEY=${SERP_API_KEY}
      - SERP_PROVIDER=${SERP_PROVIDER:-serper}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - STORIED_MODE=true
      - ATTESTATION_MODE=log_only
      - USER_STOPS_ENABLED=true
      - DISABLE_STOP_POOL=1
      - DISABLE_TOUR_CACHE=1
      - DATABASE_URL=postgresql://admin:password123@postgres-2:5432/audiotours
      - VENUE_CACHE_DB_URL=postgresql://admin:password123@postgres-2:5432/audiotours
      - DB_HOST=postgres-2
      - DB_PORT=5432
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - PYTHONUNBUFFERED=1
      - JOB_STORE_MODE=layered
      - TASK_BUDGET_ID=LOCAL-868
      - TASK_BUDGET_USD=0.40
      - COST_HARD_LIMIT_USD=0.40
      - TEST_GEMINI_MAX_USD=0.40
      - PYTHONPATH=/opt/meter
      - PAID_API_LOG=/meterlogs/paid_api_calls.jsonl
      - METER_SERVICE=LOCAL-868
    volumes:
      - ./_local868_tours:/app/tours
      - ./_meter:/opt/meter:ro
      - ./_local868_meterlogs:/meterlogs
    depends_on:
      - postgres-2

  tour-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "15002:5002"
    environment:
      - TOUR_GENERATOR_URL=http://tour-generator:5000
      - MODERNIZED_URL=http://tour-generation-modernized-1:5021
      - USER_API_URL=http://user-api-2:5000
      - COORDINATES_URL=http://coordinates-fromai:5004
      - DB_HOST=postgres-2
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - TOUR_TEST_MODE_ALLOW_REQUEST=true
      - TOUR_TRACK=subscribed
      - USER_STOPS_ENABLED=true
      - PYTHONUNBUFFERED=1
      - TASK_BUDGET_ID=LOCAL-868
      - TASK_BUDGET_USD=0.40
      - PYTHONPATH=/opt/meter
      - PAID_API_LOG=/meterlogs/paid_api_calls.jsonl
      - METER_SERVICE=LOCAL-868
    volumes:
      - ./_local868_tours:/app/tours
      - ./_meter:/opt/meter:ro
      - ./_local868_meterlogs:/meterlogs
    depends_on:
      - tour-generator
      - tour-generation-modernized-1
      - user-api-2
      - coordinates-fromai

volumes:
  local868_pg:
