# docker-compose.local778-proof.yml — LOCAL-778 OWN isolated generation stack.
#
# Separate project (-p local778), OWN postgres volume, spare ports (55xxx).
# Never touches the shared audioura-* containers or development-postgres-2-1.
# Every service builds from THIS worktree so the live run measures the LOCAL-778
# code (reuse-first), not a stale image.
#
# UP:   docker compose -p local778 -f docker-compose.local778-proof.yml up -d --build
# DOWN: docker compose -p local778 -f docker-compose.local778-proof.yml down -v
#
# The postgres is seeded at first init from ./local778-initdb (migrations +
# L2 by_reference_only=FALSE so the gate returns mode='reuse_first', plus an L2
# test device). DB name is audiotours (the services' default) but it lives in
# this stack's OWN volume, invisible to the shared dev DB.
services:
  postgres-2:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: audiotours
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      # The orchestrator/generator images ship an older libpq that cannot do
      # SCRAM; initialise this stack's OWN volume with md5 (matches the shared
      # dev DB's historical auth) so those clients can connect.
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "55433:5432"
    volumes:
      - local778_pg:/var/lib/postgresql/data
      - ./local778-initdb:/docker-entrypoint-initdb.d:ro

  tour-generator:
    build:
      context: .
      dockerfile: Dockerfile.generator
    ports:
      - "55000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERP_API_KEY=${SERP_API_KEY}
      - SERP_PROVIDER=${SERP_PROVIDER:-serper}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - STORIED_MODE=true
      - ATTESTATION_MODE=log_only
      - DATABASE_URL=postgresql://admin:password123@postgres-2:5432/audiotours
      - DB_HOST=postgres-2
      - DB_PORT=5432
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - PYTHONUNBUFFERED=1
    volumes:
      - ./tours:/app/tours
    depends_on:
      - postgres-2

  tour-generation-modernized-1:
    build:
      context: .
      dockerfile: Dockerfile.modernized
    ports:
      - "55021:5021"
    volumes:
      - ./tours:/app/tours

  coordinates-fromai:
    build:
      context: ./coordinates_fromAI
    ports:
      - "55006:5004"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  user-api-2:
    build:
      context: ./user-tracking
    ports:
      - "55003:5000"
    depends_on:
      - postgres-2
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres-2:5432/audiotours
      GATEWAY_API_KEY: ""
      ALLOW_UNAUTHENTICATED_ENTITLEMENTS: "true"

  tour-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "55002:5002"
    environment:
      - TOUR_GENERATOR_URL=http://tour-generator:5000
      - MODERNIZED_URL=http://tour-generation-modernized-1:5021
      - USER_API_URL=http://user-api-2:5000
      - DB_HOST=postgres-2
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - TOUR_TEST_MODE_ALLOW_REQUEST=true
    volumes:
      - ./tours:/app/tours
    depends_on:
      - tour-generator
      - tour-generation-modernized-1
      - user-api-2
      - coordinates-fromai

volumes:
  local778_pg:
