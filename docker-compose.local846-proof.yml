# docker-compose.local846-proof.yml — LOCAL-846 OWN isolated DB for the live proof.
#
# Separate project (-p local846), OWN postgres volume, spare port (55846).
# NEVER touches the shared audioura-* containers or the live DB.
#
# LOCAL-846 is a DB-finalisation fix (link the app "tracking" tour_requests row
# to its orchestrator job and mirror the terminal state; sweep stale/duplicate
# tracking rows to 'failed'). The proof drives the REAL production code
# (tour_orchestrator_service._set_tour_request_status and
# _sweep_stale_tracking_rows) against this throwaway Postgres, so it needs the
# database only — no LLM call, $0 of the $0.20 budget, and no shared service.
#
# UP:   docker compose -p local846 -f docker-compose.local846-proof.yml up -d
# DOWN: docker compose -p local846 -f docker-compose.local846-proof.yml down -v
services:
  postgres-2:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: audiotours
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "55846:5432"
    volumes:
      - local846_pg:/var/lib/postgresql/data
      - ./local821-initdb:/docker-entrypoint-initdb.d:ro

volumes:
  local846_pg:
