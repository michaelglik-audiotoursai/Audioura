# Tour Quality Verification Stack
# ================================
# Isolated containers for testing unmerged tour-quality branches without
# touching the shared audioura-* containers that Michael's phone uses.
#
# Mirrors the pattern of docker-compose-local85.yml (and LOCAL-92's subscribed stack).
# Ports: 5200 (generator), 5202 (orchestrator), 5221 (modernized)
# Containers: tourquality-generator, tourquality-orchestrator, tourquality-modernized
#
# USAGE:
#   # From any worktree containing the branch you want to test:
#   docker compose -f docker-compose-tourquality.yml build
#   docker compose -f docker-compose-tourquality.yml up -d
#
#   # Or from a different worktree by setting context:
#   docker compose -f /path/to/worktree/docker-compose-tourquality.yml \
#     --project-directory /path/to/worktree build
#
#   # One-command verify loop (recommended):
#   ./verify-tourquality.sh "Nice France walking" 8
#
# SHARED RESOURCES (not duplicated):
#   - PostgreSQL (development-postgres-2-1 on development_default network)
#   - tours/ volume (same physical directory)
#
# NON-CONFLICTING:
#   - Container names: tourquality-* (never audioura-*)
#   - Host ports: 5200/5202/5221 (never 5000/5002/5021)
#   - Project name prefix: tourquality (via COMPOSE_PROJECT_NAME or -p flag)

services:
  tourquality-generator:
    build:
      context: .
      dockerfile: Dockerfile.generator
      args:
        GIT_SHA: tourquality-${GIT_SHA:-local}
    container_name: tourquality-generator
    ports:
      - "5200:5000"
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERP_API_KEY=${SERP_API_KEY}
      - SERP_PROVIDER=${SERP_PROVIDER:-serper}
      - STORIED_MODE=true
      - ATTESTATION_MODE=log_only
      - BASE_URL=http://localhost:5000
      - REFERRAL_BASE_URL=http://localhost:5000
      - DATABASE_URL=postgresql://admin:password123@postgres-2:5432/audiotours
      - PYTHONUNBUFFERED=1
      - VENUE_CACHE_TTL_DAYS=${VENUE_CACHE_TTL_DAYS:-30}
      - VENUE_CACHE_NEGATIVE_TTL_DAYS=${VENUE_CACHE_NEGATIVE_TTL_DAYS:-5}
      - REQUIRE_LISTING_VERIFICATION=${REQUIRE_LISTING_VERIFICATION:-false}
      - TOUR_TEST_MODE=true
    volumes:
      - ./tours:/app/tours
    networks:
      - development_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  tourquality-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
      args:
        GIT_SHA: tourquality-${GIT_SHA:-local}
    container_name: tourquality-orchestrator
    ports:
      - "5202:5002"
    environment:
      - TOUR_GENERATOR_URL=http://tourquality-generator:5000
      - MODERNIZED_URL=http://tourquality-modernized:5021
      - TRANSLATION_URL=http://translation-service:5030
      - USER_API_URL=http://user-api-2:5000
      - TOUR_UPDATE_URL=http://tour-update:5001
      - DB_HOST=postgres-2
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - TOUR_TEST_MODE=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ./tours:/app/tours
    networks:
      - development_default
    depends_on:
      - tourquality-generator
      - tourquality-modernized

  tourquality-modernized:
    build:
      context: .
      dockerfile: Dockerfile.modernized
      args:
        GIT_SHA: tourquality-${GIT_SHA:-local}
    container_name: tourquality-modernized
    ports:
      - "5221:5021"
    environment:
      - TOUR_TEST_MODE=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ./tours:/app/tours
    networks:
      - development_default

networks:
  development_default:
    external: true
