# docker-compose.subscribed-local.yml — LOCAL-583 worktree override.
#
# D608 requires live acceptance to run in the SHIPPING container with the cost
# switches ON. The canonical subscribed-local override builds tour-generator
# from a SEPARATE detached checkout (/Users/micha/audioura-subscribed-local =
# origin/subscribed), which is exactly the D358 trap for a storied-based branch:
# it would measure OTHER code, not this LOCAL-583 worktree.
#
# This override keeps the master build context (`.` = this worktree, so the live
# run measures the LOCAL-583 code) and layers ONLY the cost/model switches from
# the subscribed-local file onto it. Build + run from THIS directory:
#
#   docker compose -p audioura \
#     -f docker-compose-master.yml \
#     -f docker-compose.subscribed-local.yml \
#     up -d --no-deps --build tour-generator
services:
  tour-generator:
    build:
      context: .
      dockerfile: Dockerfile.generator
    environment:
      - STORY_RETRY_KEEP_BEST=1
      - STORY_RETRY_EARLY_STOP=1
      - TOUR_STORY_MODEL=gpt-4.1
