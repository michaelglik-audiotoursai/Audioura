# docker-compose.subscribed-local.yml — run the LOCAL Mac Mini stack on `subscribed` code with every
# cost switch ON (Michael 2026-10-03/04, D600/D601/D604). Overrides docker-compose-master.yml.
#
# UP:    cd ~/Audioura && docker compose -p audioura -f docker-compose-master.yml \
#          -f docker-compose.subscribed-local.yml up -d --build tour-generator tour-orchestrator \
#          polly-tts-1 translation-service tour-generation-modernized-1
# BACK TO STORIED: the same command WITHOUT the second -f (rebuilds from ~/Audioura = storied).
#
# Code comes from the detached checkout ~/audioura-subscribed-local (git -C … checkout --detach
# origin/subscribed to update). The tour store is pinned to the absolute /Users/micha/Audioura/tours below, so it
# no longer matters which directory compose runs from (2026-10-19 split-store incident).
# English voice: Kokoro on the HOST (launchd com.audioura.kokoro, port 5181).
services:
  tour-generator:
    build: {context: /Users/micha/audioura-subscribed-local, dockerfile: Dockerfile.generator}
    environment:
      - PYTHONPATH=/opt/meter
      - PAID_API_LOG=/meterlogs/paid_api_calls.jsonl
      - STORY_RETRY_KEEP_BEST=1
      - STORY_RETRY_EARLY_STOP=1
      - TOUR_STORY_MODEL=gpt-4.1
      # D646 (LEAD 2026-10-10): overlap independent waits (LOCAL-651/656; same calls, same stops). Rollback = delete this line.
      - FAST_PIPELINE=1
      # LOCAL-673 (Michael: a stop, not an email): refuse paid calls once today's spend passes $8; the alert lands in ~/Audioura/meterlogs.
      - DAILY_PAID_LIMIT_USD=8
      - DAILY_PAID_LIMIT_SERVICES=generate_tour_text_service.py,translation_service.py,tour_orchestrator_service.py,polly_tts_service.py
      - ALERTS_MD=/meterlogs/ALERTS_DAILY_LIMIT.md
      # D645 re-enabled for MUSEUM tours only (LOCAL-664, 2026-10-10). Walking stays on Gemini research (Serper costs ~2 Kiro points there).
      - CHEAP_ARM_CATEGORIES=museum
      # D651 (LEAD 2026-10-11): walking research via serper_plus (LOCAL-674: evidence 7.87 vs Gemini 5.67; live Kiro 6.5 = 6.5; $0.31 vs $0.65). Rollback: delete this line.
      - WALKING_RESEARCH=serper_plus
      - NARRATION_MODEL=gpt-4.1-mini
      - RESEARCH_BACKEND=serper
    volumes:
      - /Users/micha/audioura-subscribed-local/_meter:/opt/meter:ro
      - /Users/micha/Audioura/meterlogs:/meterlogs
      - /Users/micha/Audioura/tours:/app/tours   # ONE tour store for every service (2026-10-19: ./tours resolved to the checkout when compose ran from it)
  tour-orchestrator:
    build: {context: /Users/micha/audioura-subscribed-local, dockerfile: Dockerfile.orchestrator}
    environment:
      - PYTHONPATH=/opt/meter
      - PAID_API_LOG=/meterlogs/paid_api_calls.jsonl
      - L2_SEAT_JOB_ENABLED=true          # LOCAL-596 hourly L2 eviction/offer job
      - RECOVERY_CODE_PEPPER=${RECOVERY_CODE_PEPPER}   # LOCAL-695B: HMAC selector key for O(1) recovery-code lookup; LEAD must set it in ~/Audioura/.env (32+ random bytes). If unset, recovery routes are disabled (never a scan).
    volumes:
      - /Users/micha/audioura-subscribed-local/_meter:/opt/meter:ro
      - /Users/micha/Audioura/meterlogs:/meterlogs
      - /Users/micha/Audioura/tours:/app/tours   # ONE tour store for every service (2026-10-19: ./tours resolved to the checkout when compose ran from it)
  user-api-2:                             # LOCAL-595/596/598 entitlements, queue, IAP verify
    build: {context: /Users/micha/audioura-subscribed-local/user-tracking}
    environment:
      IAP_VERIFY_MODE: stub                 # D652: TEST PURCHASE on the local stack until the Apple/Google products exist (was: apple)
      APPLE_IAP_ENVIRONMENT: Sandbox
      ALLOW_UNAUTHENTICATED_ENTITLEMENTS: "true"   # LOCAL ONLY (LOCAL-598B); no GATEWAY_API_KEY on the Mac Mini
  tour-generation-modernized-1:
    build: {context: /Users/micha/audioura-subscribed-local, dockerfile: Dockerfile.modernized}
    environment:
      - PYTHONPATH=/opt/meter
      - PAID_API_LOG=/meterlogs/paid_api_calls.jsonl
    volumes:
      - /Users/micha/audioura-subscribed-local/_meter:/opt/meter:ro
      - /Users/micha/Audioura/meterlogs:/meterlogs
      - /Users/micha/Audioura/tours:/app/tours   # ONE tour store for every service (2026-10-19: ./tours resolved to the checkout when compose ran from it)
  polly-tts-1:
    build: {context: /Users/micha/audioura-subscribed-local, dockerfile: Dockerfile.polly-tts}
    environment:
      - PYTHONPATH=/opt/meter
      - PAID_API_LOG=/meterlogs/paid_api_calls.jsonl
      - TTS_ENGINE=kokoro
      - KOKORO_URL=http://host.docker.internal:5181/render
    volumes:
      - /Users/micha/audioura-subscribed-local/_meter:/opt/meter:ro
      - /Users/micha/Audioura/meterlogs:/meterlogs
  translation-service:
    build: {context: /Users/micha/audioura-subscribed-local/translation-service, dockerfile: Dockerfile}
    environment:
      - PYTHONPATH=/opt/meter
      - PAID_API_LOG=/meterlogs/paid_api_calls.jsonl
      - TRANSLATION_ENGINE=llm
      - DAILY_PAID_LIMIT_USD=8
      - DAILY_PAID_LIMIT_SERVICES=generate_tour_text_service.py,translation_service.py,tour_orchestrator_service.py,polly_tts_service.py
      - ALERTS_MD=/meterlogs/ALERTS_DAILY_LIMIT.md
    volumes:
      - /Users/micha/audioura-subscribed-local/_meter:/opt/meter:ro
      - /Users/micha/Audioura/meterlogs:/meterlogs
  tour-editing-phase2:
    environment:
      - PYTHONPATH=/opt/meter
      - PAID_API_LOG=/meterlogs/paid_api_calls.jsonl
    volumes:
      - /Users/micha/audioura-subscribed-local/_meter:/opt/meter:ro
      - /Users/micha/Audioura/meterlogs:/meterlogs
      - /Users/micha/Audioura/tours:/app/tours   # ONE tour store for every service (2026-10-19: ./tours resolved to the checkout when compose ran from it)
  map-delivery:                           # LOCAL-657 version/updated_at on /tours-near + /tour-by-code
    build: {context: /Users/micha/audioura-subscribed-local/map_delivery}
