# docker-compose.local884-proof.yml: LOCAL-884 OWN isolated database (D753).
#
# Separate compose project (-p local884), OWN postgres volume, spare port 55984.
# NEVER touches the shared audioura-* containers, the shared dev postgres
# (development-postgres-2-1 on :5433), or the live DB. Schema/seed are the repo's
# local821-initdb (same as the LOCAL-821/872c/878/879/880/881/882/883 stacks).
#
# The generator runs IN-PROCESS from this worktree (run_cloud_parity_proof_884.py),
# so a live run measures exactly this branch's code; every DB_* / DATABASE_URL /
# VENUE_CACHE_DB_URL it reads is pointed here. Before the cold+warm runs the
# harness loads the CLOUD cache snapshot (GCloud_Storied read-only export) into
# this disposable DB, so the warm cache holds exactly the cloud's old positive AND
# negative evidence rows.
#
# UP:   docker compose -p local884 -f docker-compose.local884-proof.yml up -d
# DOWN: docker compose -p local884 -f docker-compose.local884-proof.yml down -v
services:
  postgres-884:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: audiotours
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "55984:5432"
    volumes:
      - local884_pg:/var/lib/postgresql/data
      - ./local821-initdb:/docker-entrypoint-initdb.d:ro

volumes:
  local884_pg:
