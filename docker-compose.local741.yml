# docker-compose.local741.yml — LOCAL-741 live test stack.
#
# A fully ISOLATED news pipeline built from THIS worktree, on its own project
# name (local741) and spare host ports (547xx). It writes ONLY to the existing
# audiotours_test database (never `audiotours`, never production), and never
# touches the running `audioura-*` / `development-*` containers.
#
# HARD ISOLATION RULES (task contract):
#   * project name: local741  (never `audioura`)
#   * spare host ports 547xx
#   * DB_NAME=audiotours_test on the shared dev postgres (development-postgres-2-1)
#   * build context is THIS worktree ('.') so newsletter_processor carries the
#     LOCAL-741 fix.
#
# UP:
#   docker compose -p local741 -f docker-compose.local741.yml up -d --build
# DOWN:
#   docker compose -p local741 -f docker-compose.local741.yml down
#
# The five services talk to each other by their local741 container names over
# the shared development_default network (so they also reach the test DB).

networks:
  default:
    name: development_default
    external: true

services:
  newsletter-processor-741:
    build:
      context: .
      dockerfile: Dockerfile.newsletter-processor
    container_name: newsletter-processor-741
    ports:
      - "54717:5017"
    environment:
      - PORT=5017
      - DB_HOST=development-postgres-2-1
      - DB_PORT=5432
      - DB_NAME=audiotours_test
      - DB_USER=admin
      - DB_PASSWORD=password123
      - NEWS_ORCHESTRATOR_URL=http://news-orchestrator-741:5012
      - INTERNAL_SERVICE_SECRET=local741-internal
      - PYTHONUNBUFFERED=1
    restart: "no"

  news-orchestrator-741:
    build:
      context: .
      dockerfile: Dockerfile.cloudrun
    command: python news_orchestrator_service.py
    container_name: news-orchestrator-741
    ports:
      - "54712:5012"
    environment:
      - DB_HOST=development-postgres-2-1
      - DB_PORT=5432
      - DB_NAME=audiotours_test
      - DB_USER=admin
      - DB_PASSWORD=password123
      - NEWS_GENERATOR_URL=http://news-generator-741:5010
      - NEWS_PROCESSOR_URL=http://news-processor-741:5011
      - INTERNAL_SERVICE_SECRET=local741-internal
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
    restart: "no"

  news-generator-741:
    build:
      context: .
      dockerfile: Dockerfile.cloudrun
    command: python news_generator_service.py
    container_name: news-generator-741
    ports:
      - "54710:5010"
    environment:
      - DB_HOST=development-postgres-2-1
      - DB_PORT=5432
      - DB_NAME=audiotours_test
      - DB_USER=admin
      - DB_PASSWORD=password123
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
    restart: "no"

  news-processor-741:
    build:
      context: .
      dockerfile: Dockerfile.cloudrun
    command: python news_processor_service.py
    container_name: news-processor-741
    ports:
      - "54711:5011"
    environment:
      - DB_HOST=development-postgres-2-1
      - DB_PORT=5432
      - DB_NAME=audiotours_test
      - DB_USER=admin
      - DB_PASSWORD=password123
      - POLLY_TTS_URL=http://polly-tts-741:5018
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
    restart: "no"

  polly-tts-741:
    build:
      context: .
      dockerfile: Dockerfile.polly-tts
    container_name: polly-tts-741
    ports:
      - "54718:5018"
    environment:
      # Route to the host-native Kokoro engine (same as the shared stack) so the
      # live test synthesises at $0 TTS cost; Polly is only a fallback.
      - TTS_ENGINE=kokoro
      - KOKORO_URL=http://host.docker.internal:5181/render
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - DB_HOST=development-postgres-2-1
      - DB_PORT=5432
      - DB_NAME=audiotours_test
      - DB_USER=admin
      - DB_PASSWORD=password123
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
