# LOCAL-830 — ISOLATED Postgres for the category-scoped pool-reuse live proof.
# Own project (-p local830), own ephemeral volume (tmpfs), own host port 55830 —
# never the shared audioura-* stack, never development-postgres-2-1, never the
# live DB.
#
#   docker compose -p local830 -f docker-compose.local830-proof.yml up -d
#   docker compose -p local830 -f docker-compose.local830-proof.yml down -v
services:
  local830-postgres:
    image: postgres:15
    container_name: local830-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: audiotours
    ports:
      - "55830:5432"
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral: isolated, wiped on down -v
