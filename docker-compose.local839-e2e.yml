# docker-compose.local839-e2e.yml — LOCAL-839 END-TO-END orchestrator proof,
# budget-safe (NO paid tour-generator). Same stack as the -proof file but the
# generator is a zero-cost stand-in (fake_generator_local839.py) returning a
# fixed 3-stop walking tour, so the REAL orchestrator drives the REAL two
# modernized instances (behind round-robin, separate tours dirs) and stores the
# tour ONCE at ~$0 (kokoro TTS only). Proves "stored once, audio plays" across
# >1 modernized instance through the full orchestrator path.
#
# UP:   docker compose -p local839e -f docker-compose.local839-e2e.yml up -d --build
# DOWN: docker compose -p local839e -f docker-compose.local839-e2e.yml down -v
services:
  postgres-2:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: audiotours
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "55732:5432"
    volumes:
      - local839e_pg:/var/lib/postgresql/data
      - ./local821-initdb:/docker-entrypoint-initdb.d:ro

  # Zero-cost generator stand-in (no OpenAI/SERP/Gemini).
  tour-generator:
    build:
      context: .
      dockerfile: Dockerfile.fake-generator-local839
    ports:
      - "55700:5000"
    environment:
      - PYTHONUNBUFFERED=1

  tour-generation-modernized-1:
    build:
      context: .
      dockerfile: Dockerfile.modernized
    environment:
      - JOB_STORE_MODE=layered
      - DB_HOST=postgres-2
      - DB_PORT=5432
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - POLLY_TTS_URL=http://polly-tts-1:5018
      - INSTANCE_ID=modernized-A
      - PYTHONUNBUFFERED=1
    volumes:
      - ./tours_local839e_a:/app/tours
    depends_on:
      - postgres-2

  tour-generation-modernized-2:
    build:
      context: .
      dockerfile: Dockerfile.modernized
    environment:
      - JOB_STORE_MODE=layered
      - DB_HOST=postgres-2
      - DB_PORT=5432
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - POLLY_TTS_URL=http://polly-tts-1:5018
      - INSTANCE_ID=modernized-B
      - PYTHONUNBUFFERED=1
    volumes:
      - ./tours_local839e_b:/app/tours
    depends_on:
      - postgres-2

  modernized-lb:
    image: nginx:1.25-alpine
    volumes:
      - ./local839-modernized-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "55721:5021"
    depends_on:
      - tour-generation-modernized-1
      - tour-generation-modernized-2

  polly-tts-1:
    build:
      context: .
      dockerfile: Dockerfile.polly-tts
    ports:
      - "55718:5018"
    environment:
      - TTS_ENGINE=${TTS_ENGINE:-kokoro}
      - KOKORO_URL=http://host.docker.internal:5181/render
    env_file:
      - /Users/micha/Audioura/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  user-api-2:
    build:
      context: ./user-tracking
    ports:
      - "55703:5000"
    environment:
      - ALLOW_UNAUTHENTICATED_ENTITLEMENTS=true
      - DATABASE_URL=postgresql://admin:password123@postgres-2:5432/audiotours
      - DB_HOST=postgres-2
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - GATEWAY_API_KEY=""
    depends_on:
      - postgres-2

  coordinates-fromai:
    build:
      context: ./coordinates_fromAI
    ports:
      - "55706:5004"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  tour-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "55702:5002"
    environment:
      - TOUR_GENERATOR_URL=http://tour-generator:5000
      - MODERNIZED_URL=http://modernized-lb:5021
      - USER_API_URL=http://user-api-2:5000
      - COORDINATES_URL=http://coordinates-fromai:5004
      - TOUR_TRACK=subscribed
      - DB_HOST=postgres-2
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - TOUR_TEST_MODE_ALLOW_REQUEST=true
      - PYTHONUNBUFFERED=1
      - TASK_BUDGET_ID=LOCAL-839
      - TASK_BUDGET_USD=0.40
    volumes:
      - ./tours_local839e_orch:/app/tours
    depends_on:
      - tour-generator
      - modernized-lb
      - user-api-2
      - coordinates-fromai

volumes:
  local839e_pg:
