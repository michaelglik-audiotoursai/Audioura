services:
  tour-id-resolution:
    image: tour-id-resolution:latest
    container_name: tour-id-resolution-1
    ports:
      - "5025:5025"
    volumes:
      - ./tours:/app/tours:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres-2
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_PORT=5432
    networks:
      - development_default
    restart: unless-stopped

networks:
  development_default:
    external: true