# local839-modernized-lb.conf — round-robin across the TWO modernized instances.
#
# LOCAL-839 live proof: the orchestrator talks to ONE url (MODERNIZED_URL =
# http://modernized-lb:5021) and nginx spreads each request across instance A
# and instance B in strict round-robin. So /process may land on A, a /status
# poll on B, the /download on A-or-B — the exact cross-instance hop that used to
# 404 ("Job not found" / ZIP only on the owning instance's disk). With the
# layered store + inline-ZIP handoff, whichever instance answers can serve the
# job. No sticky sessions, no ip_hash — we WANT the requests to spread.
upstream modernized_pool {
    server tour-generation-modernized-1:5021;
    server tour-generation-modernized-2:5021;
}

server {
    listen 5021;

    # Round-robin (nginx default). Retry the other upstream on a connect/5xx so
    # a transient hiccup on one instance does not fail the orchestrator call;
    # the point under test is that EITHER instance can answer correctly.
    location / {
        proxy_pass http://modernized_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        # Add a header so the proof can SEE which instance served each response.
        add_header X-Upstream $upstream_addr always;
    }
}
