# docker-compose.local883-proof.yml: LOCAL-883 OWN isolated database (D753).
#
# Separate compose project (-p local883), OWN postgres volume, spare port 55983.
# NEVER touches the shared audioura-* containers, the shared dev postgres
# (development-postgres-2-1 on :5433), or the live DB. Schema/seed are the repo's
# local821-initdb (same as the LOCAL-821/872c/878/879/880/881/882 stacks).
#
# The generator runs IN-PROCESS from this worktree (run_cloud_parity_proof_883.py),
# so a live run measures exactly this branch's code; every DB_* / DATABASE_URL /
# VENUE_CACHE_DB_URL it reads is pointed here. The WARM-cache seed step runs the
# subscribed base commit (a831ba0c) against this SAME DB first, so the cache
# holds base-rule entries before the cold+warm runs.
#
# UP:   docker compose -p local883 -f docker-compose.local883-proof.yml up -d
# DOWN: docker compose -p local883 -f docker-compose.local883-proof.yml down -v
services:
  postgres-883:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: audiotours
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "55983:5432"
    volumes:
      - local883_pg:/var/lib/postgresql/data
      - ./local821-initdb:/docker-entrypoint-initdb.d:ro

volumes:
  local883_pg:
