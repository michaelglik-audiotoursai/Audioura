# docker-compose.local873c-proof.yml: LOCAL-873C OWN isolated database.
#
# Separate compose project (-p local873c), OWN postgres volume, spare port 55975.
# NEVER touches the shared audioura-* containers, the shared dev postgres
# (development-postgres-2-1 on :5433), or the live DB. Schema/seed are the repo's
# local821-initdb (same as the LOCAL-821/833/872c/873/873B/878 proof stacks).
#
# The generator runs IN-PROCESS from this worktree (run_local873c_live.py), so
# the live run measures exactly this branch's code; every DB_* / DATABASE_URL /
# VENUE_CACHE_DB_URL it reads is pointed here.
#
# UP:   docker compose -p local873c -f docker-compose.local873c-proof.yml up -d
# DOWN: docker compose -p local873c -f docker-compose.local873c-proof.yml down -v
services:
  postgres-873c:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: audiotours
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "55975:5432"
    volumes:
      - local873c_pg:/var/lib/postgresql/data
      - ./local821-initdb:/docker-entrypoint-initdb.d:ro

volumes:
  local873c_pg:
