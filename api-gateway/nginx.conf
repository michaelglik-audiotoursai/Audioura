server {
    listen 8080;
    
    # Health check
    location /health {
        return 200 '{"status":"healthy","service":"api-gateway"}';
        add_header Content-Type application/json;
    }

    # === MAP DELIVERY (tours-near, download-tour, tour resolve, search) ===
    location /tours-near/ {
        proxy_pass https://map-delivery-60899077572.us-central1.run.app/tours-near/;
        proxy_ssl_server_name on;
        proxy_set_header Host map-delivery-60899077572.us-central1.run.app;
    }
    location /download-tour/ {
        proxy_pass https://map-delivery-60899077572.us-central1.run.app/download-tour/;
        proxy_ssl_server_name on;
        proxy_set_header Host map-delivery-60899077572.us-central1.run.app;
    }
    location ~ ^/tour/([0-9]+)/resolve$ {
        proxy_pass https://map-delivery-60899077572.us-central1.run.app$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host map-delivery-60899077572.us-central1.run.app;
    }
    location /search-tours {
        proxy_pass https://map-delivery-60899077572.us-central1.run.app/search-tours;
        proxy_ssl_server_name on;
        proxy_set_header Host map-delivery-60899077572.us-central1.run.app;
    }

    # === TOUR ORCHESTRATOR (generate, status, download, tour-status) ===
    location /generate-complete-tour {
        proxy_pass https://tour-orchestrator-60899077572.us-central1.run.app/generate-complete-tour;
        proxy_ssl_server_name on;
        proxy_set_header Host tour-orchestrator-60899077572.us-central1.run.app;
        proxy_read_timeout 600;
    }
    location ~ ^/status/ {
        proxy_pass https://tour-orchestrator-60899077572.us-central1.run.app$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host tour-orchestrator-60899077572.us-central1.run.app;
    }
    location ~ ^/download/ {
        proxy_pass https://tour-orchestrator-60899077572.us-central1.run.app$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host tour-orchestrator-60899077572.us-central1.run.app;
        proxy_read_timeout 120;
    }
    location /tour-status {
        proxy_pass https://tour-orchestrator-60899077572.us-central1.run.app/tour-status;
        proxy_ssl_server_name on;
        proxy_set_header Host tour-orchestrator-60899077572.us-central1.run.app;
    }
    location /jobs {
        proxy_pass https://tour-orchestrator-60899077572.us-central1.run.app/jobs;
        proxy_ssl_server_name on;
        proxy_set_header Host tour-orchestrator-60899077572.us-central1.run.app;
    }

    # === TRANSLATION ===
    location /translate-with-audio {
        proxy_pass https://translation-service-60899077572.us-central1.run.app/translate-with-audio;
        proxy_ssl_server_name on;
        proxy_set_header Host translation-service-60899077572.us-central1.run.app;
        proxy_read_timeout 300;
    }

    # === USER SYNC (placeholder — returns success for now) ===
    location /sync {
        return 200 '{"status":"success"}';
        add_header Content-Type application/json;
    }

    # === CATCH-ALL: 404 (do NOT proxy unknown paths) ===
    location / {
        return 404 '{"error":"endpoint not found","service":"api-gateway"}';
        add_header Content-Type application/json;
    }
}
