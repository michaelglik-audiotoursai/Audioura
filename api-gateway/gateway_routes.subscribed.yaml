    methods: [POST]
    auth: api_key

  - public_path: /communities/<community_id>/step-down
    backend: user-api
    upstream: /communities/{community_id}/step-down
    methods: [POST]
    auth: api_key

  - public_path: /communities/<community_id>/offer-organiser
    backend: user-api
    upstream: /communities/{community_id}/offer-organiser
    methods: [POST]
    auth: api_key

  - public_path: /communities/<community_id>/withdraw-offer
    backend: user-api
    upstream: /communities/{community_id}/withdraw-offer
    methods: [POST]
    auth: api_key

  - public_path: /communities/<community_id>/pick-organiser
    backend: user-api
    upstream: /communities/{community_id}/pick-organiser
    methods: [POST]
    auth: api_key

  - public_path: /communities/<community_id>/accept-organiser
    backend: user-api
    upstream: /communities/{community_id}/accept-organiser
    methods: [POST]
    auth: api_key

  # ========================================================================
  # TRANSLATION  (translation-subscribed) — row 52
  # ========================================================================
  - public_path: /translate-with-audio
    backend: translation
    upstream: /translate-with-audio
