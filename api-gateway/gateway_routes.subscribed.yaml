    auth: api_key

  - public_path: /tour/<tour_id>/download-failed
    backend: map-delivery
    upstream: /tour/{tour_id}/download-failed
    methods: [POST]
    auth: api_key

  # ========================================================================
  # TOUR ORCHESTRATOR  (tour-orchestrator-subscribed) — rows 1-23, 70, 71, 83, 84
