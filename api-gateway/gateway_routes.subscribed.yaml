internal_only:
  # Admin moderation / billing surface. These require the DISTINCT ADMIN_API_KEY
  # (user-tracking/communities_api.py: _require_admin_key), which the app NEVER
  # carries. They must NOT be reachable from the public gateway — operators call
  # them service-to-service (OIDC) or via an internal tool. Listing them here
  # documents that their omission from `routes` is deliberate, not an oversight.
  - backend: user-api
    path: /communities/admin/reports
    reason: "Admin-only moderation queue (ADMIN_API_KEY); never exposed publicly."
  - backend: user-api
    path: /communities/admin/actions
    reason: "Admin-only moderation audit log (ADMIN_API_KEY)."
  - backend: user-api
    path: /communities/admin/ban
    reason: "Admin-only user ban (ADMIN_API_KEY)."
  - backend: user-api
    path: /communities/admin/unban
    reason: "Admin-only user unban (ADMIN_API_KEY)."
  - backend: user-api
    path: /communities/<id>/admin/bar
    reason: "Admin-only bar a member from a community (ADMIN_API_KEY)."
  - backend: user-api
    path: /communities/<id>/admin/unbar
    reason: "Admin-only unbar (ADMIN_API_KEY)."
  - backend: user-api
    path: /communities/<id>/admin/disable
    reason: "Admin-only disable a community (ADMIN_API_KEY)."
  - backend: user-api
    path: /communities/admin/support-id
    reason: "Admin-only reverse support-id lookup (ADMIN_API_KEY); handles PII."
  - backend: user-api
    path: /communities/admin/grant-tour
    reason: "Admin-only comp a tour to a user (ADMIN_API_KEY)."
  - backend: user-api
    path: /communities/<id>/admin/extend-pass
    reason: "Admin-only extend a community pass (ADMIN_API_KEY)."
  - backend: user-api
    path: /communities/<id>/admin/grant-pass
    reason: "Admin-only grant a community pass (ADMIN_API_KEY)."
  - backend: user-api
    path: /communities/admin/add-plan-units
    reason: "Admin-only top up plan units (ADMIN_API_KEY); billing-sensitive."
  - backend: user-api
    path: /communities/admin/extend-plan
    reason: "Admin-only extend a plan (ADMIN_API_KEY); billing-sensitive."
  - backend: user-api
    path: /communities/admin/refund-google
    reason: "Admin-only Google Play refund (ADMIN_API_KEY); money movement."
  - backend: user-api
    path: /communities/admin/apple-refund-message
    reason: "Admin-only Apple refund note (ADMIN_API_KEY); money movement."
  - backend: user-api
    path: /communities/admin/ledger
    reason: "Admin-only wallet/plan ledger export (ADMIN_API_KEY); financial data."
  - backend: newsletter
    path: /decrypt_credentials
    reason: "Handles raw credentials; service-to-service only (OIDC-authenticated inter-service calls)."
