    auth: api_key

  # NOTE: /sync is NOT routed here. Like the Beta/Storied gateway, the gateway's
  # own intrinsic /sync handler (main.py) answers it; adding a manifest route
  # would collide with that endpoint. outbox_service degrades safely either way.

  - public_path: /delete-account/<secret_id>
