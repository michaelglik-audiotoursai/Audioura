  - public_path: /tour/<tour_id>/role
    backend: orchestrator
    upstream: /tour/{tour_id}/role
    methods: [GET]
    auth: api_key

  # --- recovery code ---
  - public_path: /recovery-code/generate
    backend: orchestrator
    upstream: /recovery-code/generate
