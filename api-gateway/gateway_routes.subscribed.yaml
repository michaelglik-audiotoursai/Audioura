    auth: api_key

  - public_path: /download-tour/<tour_id>
    backend: map-delivery
    upstream: /download-tour/{tour_id}
    methods: [GET]
    auth: api_key
    timeout: 30

  - public_path: /search-tours
    backend: map-delivery
    upstream: /search-tours
    methods: [GET, POST]
    auth: api_key

  - public_path: /tour-by-code/<code>
    backend: map-delivery
    upstream: /tour-by-code/{code}
    methods: [GET]
    auth: api_key

  - public_path: /tour-info/<tour_id>
    backend: map-delivery
    upstream: /tour-info/{tour_id}
    methods: [GET]
    auth: api_key

  - public_path: /report-tour
    backend: map-delivery
    upstream: /report-tour
    methods: [POST]
    auth: api_key

  - public_path: /how-we-score
    backend: map-delivery
