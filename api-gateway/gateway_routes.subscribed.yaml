    backend: tour-editing
    upstream: /tour/{tour_id}/update-stop
    methods: [POST]
    auth: api_key
    timeout: 300

  - public_path: /tour/<tour_id>/job-status/<job_id>
    backend: tour-editing
    upstream: /tour/{tour_id}/job-status/{job_id}
    methods: [GET]
    auth: api_key

