##############################################################################
# Audioura API Gateway Route Manifest — SUBSCRIBED TRACK
# ======================================================
# The route manifest the Subscribed gateway loads (GATEWAY_ROUTES_FILE). Same
# format as gateway_routes.yaml (the Beta/Storied manifest, which this file does
# NOT touch). Selected at deploy time by pointing GATEWAY_ROUTES_FILE at this
# file:
#
#     GATEWAY_ROUTES_FILE=/app/api-gateway/gateway_routes.subscribed.yaml
#
# Why a separate manifest (LOCAL-764 / D708): Subscribed is its own stack with
# its own services (user-api, pricing/wallet, recovery, communities, IAP verify,
# custom audio, voice, tour-id-resolution). Beta's gateway hosts NONE of those,
# so a Subscribed build pointed at Beta's gateway 404s every community /
# entitlement / purchase / recovery / pricing call. This manifest routes EVERY
# call the Subscribed app makes to the matching `-subscribed` backend.
#
# Coverage is enforced by api-gateway/test_subscribed_route_coverage.py, which
# scans audio_tour_app/lib for Endpoints.*(Service.x, '<path>') (and the
# news-status/news-download cloud paths) and fails if any app path lacks a route
# here.
#
# Fields:
#   public_path  - the path exposed on subscribed-api.audioura.com
#   backend      - key from 'backends' map
#   upstream     - the path sent to the backend service
#   methods      - list of HTTP methods
#   auth         - 'api_key' (requires X-API-Key) or 'none' (public)
#   timeout      - request timeout in seconds (default 60)
#
# Auth policy (LOCAL-764): every app-facing route is 'api_key' — the Subscribed
# app always sends the baked-in X-API-Key in cloud mode (Endpoints.apiHeaders),
# and the Beta manifest has no 'none' routes either, so there is nothing to
# expose publicly. Admin routes (ADMIN_API_KEY, which the app never carries) are
# NOT exposed by the gateway at all — see 'internal_only' at the bottom.
##############################################################################

backends:
  # Each is an env placeholder resolved at startup (${VAR:-default}); the Cloud
  # Run default URLs are placeholders for the Subscribed deployment and are
  # overridden by SUBSCRIBED_GCLOUD_ENV.md's *_URL values at deploy time.
  map-delivery:        ${MAP_DELIVERY_URL:-https://map-delivery-subscribed-60899077572.us-central1.run.app}
  orchestrator:        ${ORCHESTRATOR_URL:-https://tour-orchestrator-subscribed-60899077572.us-central1.run.app}
  user-api:            ${USER_API_URL:-https://user-api-subscribed-60899077572.us-central1.run.app}
  translation:         ${TRANSLATION_URL:-https://translation-subscribed-60899077572.us-central1.run.app}
  news-orchestrator:   ${NEWS_ORCHESTRATOR_URL:-https://news-orchestrator-subscribed-60899077572.us-central1.run.app}
  newsletter:          ${NEWSLETTER_URL:-https://newsletter-subscribed-60899077572.us-central1.run.app}
  treats:              ${TREATS_URL:-https://treats-subscribed-60899077572.us-central1.run.app}
  tour-editing:        ${TOUR_EDITING_URL:-https://tour-editing-subscribed-60899077572.us-central1.run.app}
  tour-id-resolution:  ${TOUR_ID_RESOLUTION_URL:-https://tour-id-resolution-subscribed-60899077572.us-central1.run.app}
  generator:           ${GENERATOR_URL:-https://tour-generator-subscribed-60899077572.us-central1.run.app}
  voice:               ${VOICE_URL:-https://voice-subscribed-60899077572.us-central1.run.app}
  custom-audio:        ${CUSTOM_AUDIO_URL:-https://custom-audio-subscribed-60899077572.us-central1.run.app}

