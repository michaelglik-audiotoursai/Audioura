  - public_path: /communities/<community_id>
    backend: user-api
    upstream: /communities/{community_id}
    methods: [GET, DELETE]
    auth: api_key

  - public_path: /communities/<community_id>/join
    backend: user-api
    upstream: /communities/{community_id}/join
    methods: [POST]
    auth: api_key

  - public_path: /communities/<community_id>/report
    backend: user-api
    upstream: /communities/{community_id}/report
    methods: [POST]
    auth: api_key

  - public_path: /communities/<community_id>/episodes
    backend: user-api
    upstream: /communities/{community_id}/episodes
    methods: [GET, POST]
    auth: api_key

  - public_path: /communities/<community_id>/import-feed
    backend: user-api
    upstream: /communities/{community_id}/import-feed
    methods: [POST]
    auth: api_key

  - public_path: /communities/<community_id>/build-audio-tour
    backend: user-api
    upstream: /communities/{community_id}/build-audio-tour
