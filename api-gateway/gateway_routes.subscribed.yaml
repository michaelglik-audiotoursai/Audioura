  # NOTE: the app's two /health diagnostics probes (Service.userDb and
  # Service.orchestrator, about_screen) are intentionally NOT routed to a
  # backend. Exactly as on the Beta/Storied gateway, a public GET /health is
  # answered by the gateway's OWN intrinsic /health handler (main.py), so both
  # probes report the gateway is up. The about_screen calls are diagnostics-only
  # and degrade safely (storied_compat_allowlist). A per-backend health route
  # would collide with that intrinsic endpoint and buys nothing.

  # ========================================================================
  # USER API  (user-api-subscribed) — rows 33-47, 68, 69, 72-81, 82, 34
  # Communities, entitlements, L2 seats, purchases/IAP verify, legal,
  # user registration, support id.
  # ========================================================================
  - public_path: /user
    backend: user-api
    upstream: /user
    methods: [GET, POST, PUT]
    auth: api_key

  - public_path: /user/<secret_id>
    backend: user-api
    upstream: /user/{secret_id}
    methods: [GET, PUT]
    auth: api_key

  - public_path: /support-id
    backend: user-api
    upstream: /support-id
    methods: [GET]
    auth: api_key

