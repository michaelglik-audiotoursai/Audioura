    backend: orchestrator
    upstream: /wallet/{user_id}/topup
    methods: [POST]
    auth: api_key

  # --- reviews ---
  - public_path: /tour/<tour_id>/reviews
    backend: orchestrator
    upstream: /tour/{tour_id}/reviews
    methods: [GET]
    auth: api_key

  - public_path: /tour/<tour_id>/distribution
    backend: orchestrator
    upstream: /tour/{tour_id}/distribution
    methods: [GET]
    auth: api_key

  - public_path: /tour/<tour_id>/review
    backend: orchestrator
