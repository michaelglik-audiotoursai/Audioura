    backend: user-api
    upstream: /purchases/verify
    methods: [POST]
    auth: api_key

  - public_path: /purchases/mode
    backend: user-api
    upstream: /purchases/mode
    methods: [GET]
    auth: api_key

  # --- legal / document acceptance ---
  - public_path: /document-acceptance
    backend: user-api
    upstream: /document-acceptance
    methods: [GET, POST]
    auth: api_key

  # --- communities ---
  - public_path: /communities
    backend: user-api
    upstream: /communities
    methods: [POST]
    auth: api_key

  - public_path: /communities/map
    backend: user-api
    upstream: /communities/map
    methods: [GET]
    auth: api_key

  - public_path: /communities/mine
    backend: user-api
    upstream: /communities/mine
    methods: [GET]
    auth: api_key

  - public_path: /communities/mine-owned
    backend: user-api
    upstream: /communities/mine-owned
    methods: [GET]
    auth: api_key

  - public_path: /communities/new-tours
    backend: user-api
    upstream: /communities/new-tours
    methods: [GET]
    auth: api_key

  - public_path: /communities/pass-prices
    backend: user-api
    upstream: /communities/pass-prices
