# docker-compose.local894b-proof.yml — LOCAL-894B OWN isolated stack for the REAL orchestrator path
# (POST /generate-complete-tour with RAW strings, as the cloud does) (D753: own stack, never the shared audioura-*
# containers, never :5000/:5002, never the live DB).
#
# Separate project (-p local894b), OWN postgres volume. Spare host ports:
#   generator 26100, orchestrator 26102, user-api 26103, postgres 55995. Everything else stays on
# the compose network. Every service builds from THIS worktree.
#
# Spend is capped by the meter contract: PYTHONPATH=/opt/meter, TASK_BUDGET_ID=LOCAL-894B,
# TASK_BUDGET_USD=0.45, meter rows land in ./_local894b_meterlogs (never committed).
#
# UP:   docker compose -p local894b -f docker-compose.local894b-proof.yml up -d --build
# DOWN: docker compose -p local894b -f docker-compose.local894b-proof.yml down -v
services:
  postgres-2:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: audiotours
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "55995:5432"
    volumes:
      - local894b_pg:/var/lib/postgresql/data
      - ./local821-initdb:/docker-entrypoint-initdb.d:ro

  polly-tts-1:
    build:
      context: .
      dockerfile: Dockerfile.polly-tts
    environment:
      - TTS_ENGINE=kokoro
      - KOKORO_URL=http://host.docker.internal:5181/render
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tour-generation-modernized-1:
    build:
      context: .
      dockerfile: Dockerfile.modernized
    environment:
      - JOB_STORE_MODE=layered
      - DB_HOST=postgres-2
      - DB_PORT=5432
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - POLLY_TTS_URL=http://polly-tts-1:5018
      - PYTHONUNBUFFERED=1
    volumes:
      - ./_local894b_tours:/app/tours
    depends_on:
      - postgres-2
      - polly-tts-1

  coordinates-fromai:
    build:
      context: ./coordinates_fromAI
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  user-api-2:
    build:
      context: ./user-tracking
    ports:
      - "26103:5000"
    depends_on:
      - postgres-2
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres-2:5432/audiotours
      DB_HOST: postgres-2
      DB_NAME: audiotours
      DB_USER: admin
      DB_PASSWORD: password123
      DB_PORT: "5432"
      GATEWAY_API_KEY: ""
      ALLOW_UNAUTHENTICATED_ENTITLEMENTS: "true"

  tour-generator:
    build:
      context: .
      dockerfile: Dockerfile.generator
    ports:
      - "26100:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERP_API_KEY=${SERP_API_KEY}
      - SERP_PROVIDER=${SERP_PROVIDER:-serper}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - STORIED_MODE=true
      - ATTESTATION_MODE=log_only
      - USER_STOPS_ENABLED=true
      - DISABLE_STOP_POOL=1
      - DISABLE_TOUR_CACHE=1
      - DATABASE_URL=postgresql://admin:password123@postgres-2:5432/audiotours
      - VENUE_CACHE_DB_URL=postgresql://admin:password123@postgres-2:5432/audiotours
      - DB_HOST=postgres-2
      - DB_PORT=5432
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - PYTHONUNBUFFERED=1
      - JOB_STORE_MODE=layered
      - TASK_BUDGET_ID=LOCAL-894B
      - TASK_BUDGET_USD=0.45
      - COST_HARD_LIMIT_USD=0.50
      - TEST_GEMINI_MAX_USD=0.30
      - PYTHONPATH=/opt/meter
      - PAID_API_LOG=/meterlogs/paid_api_calls.jsonl
      - METER_SERVICE=LOCAL-894B
      - EVIDENCE_BUNDLE_DUMP=/meterlogs/evidence_bundle.json
      - GROUNDING_GATE_ENABLED=1
      - GROUNDING_GATE_MODEL=gpt-4.1-mini
      - LANDMARK_LIVE_LOOKUP=1
      - CHEAP_ARM_CATEGORIES=museum,walking,restaurant,facility,specialized
      - NARRATION_MODEL=gpt-4.1-mini
      - SIGNATURE_STORY_ENABLED=1
      - SIGNATURE_STORY_MODEL=gpt-4.1-mini
      - RESEARCH_BACKEND=serper
      - STORY_PASS_MODEL=gpt-4.1-mini
      - TOUR_STORY_MODEL=gpt-4o-mini
      - TOUR_SCOPE_COMPARE_MODEL=gpt-4o-mini
      - STOP_EXISTENCE_GATE_MODE=log_only
    volumes:
      - ./_local894b_tours:/app/tours
      - ./_meter:/opt/meter:ro
      - ./_local894b_meterlogs:/meterlogs
    depends_on:
      - postgres-2

  tour-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "26102:5002"
    environment:
      - TOUR_GENERATOR_URL=http://tour-generator:5000
      - MODERNIZED_URL=http://tour-generation-modernized-1:5021
      - USER_API_URL=http://user-api-2:5000
      - COORDINATES_URL=http://coordinates-fromai:5004
      - DB_HOST=postgres-2
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - TOUR_TEST_MODE_ALLOW_REQUEST=true
      - TOUR_TRACK=subscribed
      - USER_STOPS_ENABLED=true
      - PYTHONUNBUFFERED=1
      - TASK_BUDGET_ID=LOCAL-894B
      - TASK_BUDGET_USD=0.45
      - PYTHONPATH=/opt/meter
      - PAID_API_LOG=/meterlogs/paid_api_calls.jsonl
      - METER_SERVICE=LOCAL-894B
    volumes:
      - ./_local894b_tours:/app/tours
      - ./_meter:/opt/meter:ro
      - ./_local894b_meterlogs:/meterlogs
    depends_on:
      - tour-generator
      - tour-generation-modernized-1
      - user-api-2
      - coordinates-fromai

volumes:
  local894b_pg:
