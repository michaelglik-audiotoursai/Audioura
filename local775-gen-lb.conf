# LOCAL-775 / D718 — round-robin the two generator instances so the
# orchestrator's /status poll can land on the instance that did NOT own the job.
upstream generators {
    server generator-a:5000;
    server generator-b:5000;
}

server {
    listen 80;
    location / {
        proxy_pass http://generators;
        proxy_set_header Host $host;
        # Short timeouts so a killed owner surfaces quickly during the proof.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;   # do NOT silently retry the other upstream — we want to SEE a poll hit either one
    }
}
