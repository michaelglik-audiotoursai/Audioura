# docker-compose.local795-proof.yml  (LOCAL-795)
#
# Minimal own-stack for the LOCAL-795 live test: a dedicated Postgres and the
# tour-orchestrator (which hosts the reviews + the new per-stop note endpoints,
# built from THIS worktree so the live run measures the new code, not the dev
# stack's older image). Brought up with `-p local795` on non-conflicting host
# ports so it never touches the running development stack.
#
#   docker compose -p local795 -f docker-compose.local795-proof.yml up -d --build
#   ... exercise POST /tour/<id>/review and POST /tour/<id>/stop/<n>/note ...
#   docker compose -p local795 -f docker-compose.local795-proof.yml down -v
#
# The orchestrator needs only the DB for the review/note endpoints (the
# generation dependency URLs are unused by those routes), so no other service is
# started.

services:
  postgres-2:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: audiotours
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      # The orchestrator image is python:3.9-slim (libpq < 10) which cannot do
      # SCRAM; initialise the DB with md5 password auth so it can connect.
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    command: ["postgres", "-c", "password_encryption=md5"]
    ports:
      - "55795:5432"
    restart: unless-stopped

  tour-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "50795:5002"
    environment:
      - DB_HOST=postgres-2
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - TOUR_TEST_MODE_ALLOW_REQUEST=true
    depends_on:
      - postgres-2
    restart: unless-stopped
