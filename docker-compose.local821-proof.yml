# docker-compose.local821-proof.yml — LOCAL-821 OWN isolated orchestration stack.
#
# Separate project (-p local821), OWN postgres volume, spare ports (556xx).
# NEVER touches the shared audioura-* containers or the live DB. Every service
# builds from THIS worktree so the live run measures the LOCAL-821 code (resume
# + no-overwrite), not a stale image.
#
# UP:   docker compose -p local821 -f docker-compose.local821-proof.yml up -d --build
# DOWN: docker compose -p local821 -f docker-compose.local821-proof.yml down -v
#
# The proof (run_local821_live.sh):
#   1. POST /generate-complete-tour for a short 3-stop walking tour.
#   2. KILL the orchestrator container mid-generation (docker kill) — simulating
#      the Cloud Run SIGTERM/teardown that lost tour 279.
#   3. START a fresh orchestrator (same DB volume). ORCH_RESUME_ENABLED=true +
#      the short sweep interval make it re-attach to the already-running/finished
#      generator job (via orchestrator_jobs + generator_jobs) and finish the tour.
#   4. Prove the tour is stored EXACTLY once (one audio_tours row, tour_requests
#      'completed').
#   5. POST the IDENTICAL request again → prove the first tour's stops are
#      UNCHANGED (cache hit, number_requested++), never overwritten.
#
# The meter contract (meter_container_env) is wired on the services that make
# paid calls (generator + orchestrator) so this task's spend lands in the shared
# meterlog under service=LOCAL-821, and TASK_BUDGET_ID/USD caps it at $0.60.
services:
  postgres-2:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: audiotours
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      # The orchestrator/generator images ship an older libpq that cannot do
      # SCRAM; initialise this stack's OWN volume with md5 so those clients can
      # connect (same note as local778).
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "55533:5432"
    volumes:
      - local821_pg:/var/lib/postgresql/data
      - ./local821-initdb:/docker-entrypoint-initdb.d:ro

  tour-generator:
    build:
      context: .
      dockerfile: Dockerfile.generator
    ports:
      - "55100:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERP_API_KEY=${SERP_API_KEY}
      - SERP_PROVIDER=${SERP_PROVIDER:-serper}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - STORIED_MODE=true
      - ATTESTATION_MODE=log_only
      - DATABASE_URL=postgresql://admin:password123@postgres-2:5432/audiotours
      - DB_HOST=postgres-2
      - DB_PORT=5432
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - PYTHONUNBUFFERED=1
      # [LOCAL-775/D718] generator persists job status to generator_jobs so a
      # resumed orchestrator can re-attach to the result from any instance.
      - JOB_STORE_MODE=layered
      # Budget caps (belt-and-braces alongside the meter ledger).
      - TASK_BUDGET_ID=LOCAL-821B
      - TASK_BUDGET_USD=0.40
      - COST_HARD_LIMIT_USD=0.40
      - TEST_GEMINI_MAX_USD=0.40
      # [LOCAL-820] meter contract — spend tagged service=LOCAL-821B.
      - PYTHONPATH=/opt/meter
      - PAID_API_LOG=/meterlogs/paid_api_calls.jsonl
      - METER_SERVICE=LOCAL-821B
    volumes:
      - ./tours:/app/tours
      - ./_meter:/opt/meter:ro
      - ${LOCAL821_METER_DIR:-./local821-meterlogs}:/meterlogs
    depends_on:
      - postgres-2

  tour-generation-modernized-1:
    build:
      context: .
      dockerfile: Dockerfile.modernized
    ports:
      - "55121:5021"
    volumes:
      - ./tours:/app/tours

  coordinates-fromai:
    build:
      context: ./coordinates_fromAI
    ports:
      - "55106:5004"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  user-api-2:
    build:
      context: ./user-tracking
    ports:
      - "55103:5000"
    depends_on:
      - postgres-2
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres-2:5432/audiotours
      GATEWAY_API_KEY: ""
      ALLOW_UNAUTHENTICATED_ENTITLEMENTS: "true"

  tour-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "55102:5002"
    environment:
      - TOUR_GENERATOR_URL=http://tour-generator:5000
      - MODERNIZED_URL=http://tour-generation-modernized-1:5021
      - USER_API_URL=http://user-api-2:5000
      - COORDINATES_URL=http://coordinates-fromai:5004
      - DB_HOST=postgres-2
      - DB_NAME=audiotours
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - TOUR_TEST_MODE_ALLOW_REQUEST=true
      - TOUR_TRACK=subscribed
      - PYTHONUNBUFFERED=1
      # [LOCAL-821] resume-on-boot + periodic sweep ON, with a short interval and
      # short min-idle so the fresh orchestrator picks the killed job up quickly.
      - ORCH_RESUME_ENABLED=true
      - ORCH_SWEEP_INTERVAL_SECONDS=15
      - ORCH_SWEEP_MIN_IDLE_SECONDS=10
      - ORCH_JOB_LEASE_SECONDS=600
      # Budget caps.
      - TASK_BUDGET_ID=LOCAL-821B
      - TASK_BUDGET_USD=0.40
      # [LOCAL-820] meter contract.
      - PYTHONPATH=/opt/meter
      - PAID_API_LOG=/meterlogs/paid_api_calls.jsonl
      - METER_SERVICE=LOCAL-821B
    volumes:
      - ./tours:/app/tours
      - ./_meter:/opt/meter:ro
      - ${LOCAL821_METER_DIR:-./local821-meterlogs}:/meterlogs
    depends_on:
      - tour-generator
      - tour-generation-modernized-1
      - user-api-2
      - coordinates-fromai

volumes:
  local821_pg:
