# docker-compose.local870-proof.yml: LOCAL-870 OWN isolated database.
#
# Separate compose project (-p local870), OWN postgres volume, spare port 55970.
# NEVER touches the shared audioura-* containers, the shared dev postgres
# (development-postgres-2-1 on :5433), or the live DB. Schema/seed are the
# repo's local821-initdb (same as the LOCAL-821/833 proof stacks).
#
# The generator runs IN-PROCESS from this worktree (run_local870_live.py), so
# the live run measures exactly this branch's code; every DB_* / DATABASE_URL /
# VENUE_CACHE_DB_URL it reads is pointed here.
#
# UP:   docker compose -p local870 -f docker-compose.local870-proof.yml up -d
# DOWN: docker compose -p local870 -f docker-compose.local870-proof.yml down -v
services:
  postgres-870:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: audiotours
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "55970:5432"
    volumes:
      - local870_pg:/var/lib/postgresql/data
      - ./local821-initdb:/docker-entrypoint-initdb.d:ro

volumes:
  local870_pg:
